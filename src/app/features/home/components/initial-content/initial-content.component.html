<div>
  <h6 class="init-content-title mb-4">¡Hola, {{ user?.fullName }}!</h6>

  <div *ngIf="isLoading" class="spinner-wrapper">
    <mat-spinner diameter="35" strokeWidth="3"></mat-spinner>
  </div>

  <div *ngIf="!isLoading" class="courses-container d-flex flex-wrap gap-3">
    <div *ngFor="let course of coursesList" class="user-card border rounded shadow-sm p-2 mb-3" style="width: 220px; background-color: #fff;">
      
      <div class="img-container mb-2">
        <img
          [src]="course.picUrl"
          alt="Curso"
          class="img-fluid"
          style="width: 100%; height: 140px; object-fit: cover; border-radius: 4px;"
        />
      </div>
  
      <div class="user-info text-start">
        <strong class="d-block mb-1" style="font-size: 1rem;">{{ course.title }}</strong>
      
        <span class="d-block mb-1 text-muted" style="font-size: 0.85rem;">{{ course.authorName }}</span>
      
        <div class="d-flex align-items-center mb-1" style="font-size: 0.85rem;">
          <span class="me-1 text-warning fw-bold">{{ course.rating }}</span>
          
          <ng-container *ngFor="let star of getFullStars(course.rating)">
            <i class="fas fa-star text-warning"></i>
          </ng-container>
          <i *ngIf="hasHalfStar(course.rating)" class="fas fa-star-half-alt text-warning"></i>
          <ng-container *ngFor="let star of getEmptyStars(course.rating)">
            <i class="far fa-star text-warning"></i>
          </ng-container>
      
          <span class="text-muted ms-1">({{ course.totalRatings }})</span>
        </div>
    
        <div class="fw-bold" style="font-size: 0.95rem;">{{ course.price | number }} COP</div>
      </div>
    </div>
  </div>

</div>
